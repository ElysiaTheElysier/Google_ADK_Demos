[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-adk-prompt-improver"
version = "0.1.0"
description = "A small Google ADK demo for evaluating and improving prompts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.0,<3.0",
  "pydantic>=2.0,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["prompt_improver"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

